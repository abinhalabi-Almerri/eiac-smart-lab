<title>EIAC Interactive Lab</title>

<style>
/* Layout: one exhibition screen. A 16:9 lab image with pulsing hotspots, a slide-in detail panel, and reviewer notes underneath. A deliberately dark single theme, built for a booth screen. */
:root{
  --navy:#0b2350; --night:#071630; --panel:#0e2a5c; --bronze:#c8a36a; --bronze-d:#8c724a;
  --red:#d7213b; --ink:#f3efe6; --mute:#a9b4c9; --line:rgba(200,163,106,.28); --ok:#3fbf8a;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-disp:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.brand img{height:40px;width:auto}
.brand h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(18px,2.4vw,26px);margin:0;text-wrap:balance}
.brand p{margin:0;color:var(--mute);font-size:13px}
.tools{display:flex;gap:8px;align-items:center}
.chip{font-size:12px;letter-spacing:.04em;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--bronze)}
button{font:inherit;color:inherit;cursor:pointer}
.lang{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-weight:700}
.lang:focus-visible,.hs:focus-visible,.close:focus-visible,.tab:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}

.stage{position:relative;width:100%;aspect-ratio:2688/1520;max-width:100%;border-radius:10px;overflow:hidden;background:#000}
.stage>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.stage .lang{position:absolute;top:2%;inset-inline-end:1.5%;z-index:2;background:rgba(7,22,48,.55);font-size:12px;padding:4px 10px}
.wrap{max-width:none}
body{padding-block:8px}
.hs{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.dot{width:clamp(18px,2.2vw,34px);aspect-ratio:1;border-radius:50%;background:var(--bronze);border:3px solid #fff;box-shadow:0 0 0 0 rgba(200,163,106,.7);animation:pulse 2s infinite;display:grid;place-items:center;color:var(--night);font-weight:700;font-size:clamp(9px,1vw,14px)}
.hs.seen .dot{background:var(--ok)}
@keyframes pulse{70%{box-shadow:0 0 0 clamp(10px,1.6vw,22px) rgba(200,163,106,0)}100%{box-shadow:0 0 0 0 rgba(200,163,106,0)}}
.tag{background:rgba(7,22,48,.82);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:clamp(9px,1vw,13px);font-weight:500;white-space:nowrap}
.hs:hover .tag{background:var(--bronze);color:var(--night)}
.hint{position:absolute;bottom:3%;left:50%;transform:translateX(-50%);background:rgba(7,22,48,.8);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-size:clamp(10px,1.1vw,14px);white-space:nowrap}

.panel{position:fixed;inset:0;background:rgba(3,10,24,.72);display:flex;justify-content:flex-end;z-index:20}
[dir=ltr] .panel{justify-content:flex-end}
.sheet{width:min(560px,100%);height:100%;overflow-y:auto;background:var(--navy);border-inline-start:1px solid var(--line);padding:calc(20px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;animation:slide .35s ease}
@keyframes slide{from{transform:translateX(30px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet h2{font-family:var(--f-disp);font-size:24px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--bronze);font-size:13px;margin:2px 0 0}
.close{background:var(--panel);border:1px solid var(--line);border-radius:8px;width:36px;height:36px;flex:none;font-size:18px}
video{width:100%;border-radius:10px;background:#000;max-height:60vh}
.tabs{display:flex;gap:6px}
.tab{background:none;border:1px solid var(--line);border-radius:6px;padding:4px 12px;font-size:13px}
.tab[aria-pressed=true]{background:var(--bronze);color:var(--night);font-weight:700}
.sec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bronze);margin:0 0 6px;font-weight:700}
.sec p,.sec li{margin:0;color:var(--ink)}
.sec ol,.sec ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.ref{display:flex;flex-wrap:wrap;gap:6px}
.ref span{font-size:12px;padding:3px 9px;border-radius:5px;background:rgba(200,163,106,.14);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.limit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.03)}
.limit small{display:block;color:var(--mute);font-size:12px;margin-top:4px}
.beats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.beat{background:var(--panel);border-radius:8px;padding:8px 6px;font-size:11.5px;line-height:1.4;min-width:0}
.beat b{display:block;color:var(--bronze);font-size:11px;font-variant-numeric:tabular-nums}
.pp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pp span{display:flex;align-items:center;gap:6px;background:rgba(80,200,230,.12);border:1px solid rgba(80,200,230,.35);border-radius:999px;padding:3px 10px 3px 4px;font-size:.8em}
.pp b{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:#50c8e6;color:var(--night);font-size:.85em}
.ppv{color:var(--ok);font-size:.85em;margin-top:6px!important}
.draft{font-size:12px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.note{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:rgba(14,42,92,.45);min-width:0}
.note h3{font-family:var(--f-disp);font-size:17px;margin:0 0 6px}
.note p,.note li{color:var(--mute);margin:0}
.note ul{margin:0;padding-inline-start:18px}
@media (max-width:640px){.tag{display:none}.beats{grid-template-columns:repeat(2,minmax(0,1fr))}.hint{display:none}}
@media (prefers-reduced-motion:reduce){.stage>img,.dot,.sheet{animation:none}}
</style>
<style>
/* Full-screen mode: the image fills any TV (16:9) completely. On a phone held upright, the whole screen turns sideways so it looks the same as on the TV. */
[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0!important;overflow:hidden;background:#000}
#app{position:fixed;inset:0;container-type:size;display:grid;place-items:center;background:#000;overflow:hidden}
@media (orientation:portrait){#app{inset:auto;top:0;left:0;width:100vh;height:100vw;width:100dvh;height:100dvw;transform:rotate(90deg) translateY(-100%);transform-origin:top left}}
.stage{flex:none;max-width:none;max-height:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw,calc(100cqh * 2688 / 1520));height:min(100cqh,calc(100cqw * 1520 / 2688));aspect-ratio:auto;border-radius:0;container-type:size}
/* no automatic playback: the presenter moves between stations by hand */
#tour,#sTour{display:none}
#toast{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:20;max-width:80%;background:rgba(7,22,48,.92);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:.6em 1em;font-size:max(13px,2cqh);text-align:center}
.steps3 li{line-height:1.25}
.slide .right{overflow:hidden}
.dot{width:clamp(14px,2.1cqw,96px);border-width:max(2px,.22cqw);font-size:max(9px,.9cqw)}
.ctl{position:absolute;top:2%;inset-inline-end:1.5%;z-index:2;display:flex;gap:.6em;font-size:max(11px,1.4cqh)}
.ctl button{background:rgba(7,22,48,.5);border:1px solid var(--line);border-radius:.5em;padding:.25em .7em;font-weight:700;color:var(--ink)}
.panel{position:absolute;inset:0}
.sheet{width:max(300px,44cqw);height:100%;font-size:clamp(13px,2.2cqh,46px);padding:1.4em 1.4em 2em;gap:1em}
.sheet h2{font-size:1.6em}.sub{font-size:.85em}.close{width:2.3em;height:2.3em;font-size:1em}
.sec h3{font-size:.78em}.ref span,.tab{font-size:.82em}.limit small,.draft{font-size:.78em}
.beat{font-size:.74em}.beat b{font-size:.9em}
video{max-height:58cqh}
/* Wall screen: shows the family still; on tap the camera zooms in, the screen straightens and fills the page, then the film plays */
.stage>img.bg{transition:filter 1.2s}
.stage.zoom>img.bg{filter:blur(3px) brightness(.6)}
/* the family still is a real 16:9 picture, projected in perspective onto the wall screen's four corners (computed in script) */
.stage>img.wall{position:absolute;inset:auto;left:0;top:0;width:1600px;height:900px;max-width:none;object-fit:cover;transform-origin:0 0;cursor:pointer;z-index:1;filter:brightness(.92);opacity:0;transition:opacity .5s}
.stage.zoom>img.wall{opacity:1}
/* the dark wall screen shows only a large pulsing play button */
.hs.big .dot{width:clamp(30px,3.6cqw,150px);font-size:max(14px,1.5cqw);background:rgba(200,163,106,.95)}
.stage .hs{transition:opacity .3s;z-index:2}
.stage.zoom .hs,.stage.zoom .ctl{opacity:0;pointer-events:none}
.stage .film{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:contain;background:#000;border-radius:0;z-index:3}
.filmx{position:absolute;top:2.5%;right:1.5%;z-index:4;width:max(36px,3.4cqw);height:max(36px,3.4cqw);border-radius:50%;
  background:rgba(7,22,48,.6);border:1px solid var(--line);color:var(--ink);font-size:max(14px,1.4cqw)}
/* Presenter slides: tap a capsule, the camera pushes in, a full-screen slide is read from 3 m away */
.stage>img.bg.push{transition:transform .7s cubic-bezier(.6,0,.2,1),filter .7s}
.stage.dim>img.bg{filter:blur(6px) brightness(.45)}
.stage.dim .hs,.stage.dim .ctl,.stage.dim .wall{opacity:0;pointer-events:none;transition:opacity .3s}
.slide{position:absolute;inset:0;z-index:5;display:grid;grid-template-rows:auto 1fr auto auto;gap:2.2cqh;padding:4cqh 4cqw 3cqh;
  font-size:2.3cqh;color:var(--ink);animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:translateY(1.5cqh)}}
.slide header{display:block}
.slide .eyebrow{font-size:.8em;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze);font-weight:700}
.slide h2{font-family:var(--f-disp);font-size:3.2em;line-height:1.05;margin:.1em 0 .15em}
.slide .key{font-size:1.45em;line-height:1.3;max-width:60ch;margin:0;color:#e9e3d6}
.slide .body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:3cqw;min-height:0}
.slide .media{border-radius:1.4cqh;overflow:hidden;background:#000;min-height:0;border:1px solid var(--line)}
.slide .media img{width:100%;height:100%;object-fit:cover;display:block}
.slide .media.tall img{object-fit:contain}
.slide .right{display:flex;flex-direction:column;gap:1.6cqh;min-height:0}
.steps3{display:flex;flex-direction:column;gap:1.2cqh;margin:0;padding:0;list-style:none}
.steps3 li{display:flex;align-items:center;gap:1em;background:rgba(14,42,92,.75);border:1px solid var(--line);border-radius:1.2cqh;padding:1.1cqh 1.2em;font-size:1.25em;font-weight:500}
.steps3 b{flex:none;display:grid;place-items:center;width:2em;height:2em;border-radius:50%;background:var(--bronze);color:var(--night);font-size:.9em}
.result{background:rgba(63,191,138,.14);border:1px solid rgba(63,191,138,.55);border-radius:1.2cqh;padding:1.2cqh 1.2em;font-size:1.2em;font-weight:700;color:#bff0d9;display:flex;flex-direction:column;gap:.3em}
.chips{display:flex;flex-wrap:wrap;gap:.5em}
.chips span{font-size:.85em;padding:.3em .8em;border-radius:.4em;border:1px solid var(--line);background:rgba(200,163,106,.14);color:var(--bronze);font-weight:700}
.slide .pp{font-size:1em}
.slide .pp span{font-size:.85em}
.slide .play{align-self:flex-start;font-size:1.3em;font-weight:700;background:var(--bronze);color:var(--night);border:0;border-radius:999px;padding:.6em 1.4em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:1em}
.bar .grp{display:flex;gap:.6em;align-items:center}
.bar button{background:rgba(7,22,48,.75);border:1px solid var(--line);border-radius:999px;padding:.45em 1.1em;font-size:.95em;font-weight:700;color:var(--ink)}
.bar button.on{background:var(--bronze);color:var(--night)}
.bar .count{color:var(--mute);font-size:.9em;font-variant-numeric:tabular-nums}
.panel{z-index:10}
/* hotspots: a small transparent EIAC hologram that floats up and down */
.holo{display:block;box-sizing:border-box;width:clamp(64px,7.6cqw,210px);aspect-ratio:2.4;padding:5% 8%;border-radius:.5em;
  background:linear-gradient(180deg,rgba(14,60,110,.62),rgba(7,30,60,.42));border:1.5px solid rgba(160,235,255,.9);
  box-shadow:0 0 14px rgba(80,200,230,.55),inset 0 0 10px rgba(127,227,255,.3);backdrop-filter:blur(2px);
  animation:bob 1.8s ease-in-out infinite,glow 1.8s ease-in-out infinite}
.holo img{display:block;width:100%;height:100%;object-fit:contain;opacity:1;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 6px rgba(127,227,255,.95))}
.hs.seen .holo{opacity:.85}
.hs:hover .holo,.hs:focus-visible .holo{border-color:#fff;box-shadow:0 0 22px rgba(127,227,255,.9)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-24%)}}
@keyframes glow{0%,100%{box-shadow:0 0 10px rgba(80,200,230,.45),inset 0 0 8px rgba(127,227,255,.25)}50%{box-shadow:0 0 22px rgba(80,200,230,.85),inset 0 0 12px rgba(127,227,255,.45)}}
@media (prefers-reduced-motion:reduce){.holo{animation:none}}
/* phones: the stage is short, so text is sized for reading in the hand and the slide scrolls if needed */
@container (max-height:520px){
  .slide{font-size:max(12.5px,3.4cqh);gap:2cqh;padding:3cqh 3cqw 2.5cqh;grid-template-rows:auto auto auto auto;overflow-y:auto;align-content:start}
  .slide h2{font-size:1.9em}
  .slide .key{font-size:1.1em}
  .slide .body{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:2.5cqw}
  .slide .media{max-height:62cqh;align-self:start}
  .steps3{gap:1cqh}.steps3 li{font-size:1em;padding:.9cqh .8em}
  .result{font-size:1em}
  .slide .pp{display:none}
  .bar button{padding:.5em .9em}
  .sheet{width:min(100%,70cqw);font-size:13px}
  .dot{width:clamp(18px,2.8cqw,30px)}
}
</style>

<style>
/* one look for everything: navy glass panels, hologram cyan for interaction and data, EIAC bronze for headings and numbers */
:root{--holo:#7fe3ff;--holo-line:rgba(127,227,255,.45);--holo-fill:rgba(80,200,230,.08);--glass:rgba(3,14,34,.6)}
.hs.big{display:none}
.filmloop{position:absolute;z-index:4;top:calc(var(--vt,0px) + 2.5%);left:calc(var(--vl,0px) + 1.5% + max(36px,3.4cqw) + 12px);height:max(36px,3.4cqw);
  padding:0 1.1em;border-radius:999px;background:rgba(7,22,48,.72);border:1px solid rgba(80,200,230,.5);color:var(--ink);font-weight:700;font-size:max(13px,1.2cqw)}
.filmloop.on{background:rgba(80,200,230,.28);border-color:var(--holo);box-shadow:0 0 12px rgba(80,200,230,.5)}
/* TVs and wide screens (16:9 or wider, e.g. a TV browser with its bars): fill the whole screen; only ceiling and floor are trimmed.
   Narrower screens (3:2 laptops, iPads) keep the whole lab with the soft blurred bands. */
@container (min-aspect-ratio: 17/10){.stage{width:max(100cqw,calc(100cqh * 2688 / 1520));height:max(100cqh,calc(100cqw * 1520 / 2688))}}
#app::before{content:"";position:absolute;inset:-60px;background:#071630 url(lab.jpg) center/cover no-repeat;filter:blur(26px) brightness(.8) saturate(1.1);z-index:0}
#app>.stage{z-index:1}
.stage{box-shadow:0 0 60px 30px rgba(7,22,48,.35)}
/* overlays use only the visible part of the picture (--vl/--vt = how much is cropped on each side) */
.slide,.stage .film{inset:var(--vt,0px) var(--vl,0px)}
.stage .film{width:calc(100% - 2 * var(--vl,0px));height:calc(100% - 2 * var(--vt,0px))}
.filmx{top:calc(var(--vt,0px) + 2.5%);right:auto;left:calc(var(--vl,0px) + 1.5%)}
.ctl{top:calc(var(--vt,0px) + 2%);inset-inline-end:calc(var(--vl,0px) + 1.5%)}
/* wall TV idle screen: the EIAC logo drawn on the screen itself, in the screen's own perspective */
.tvidle{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;z-index:1;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:70px;transition:opacity .5s;
  background:radial-gradient(ellipse at 50% 45%,rgba(22,66,120,.9),rgba(4,12,28,.97) 72%)}
.tvidle::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px)}
.tvidle img{width:900px;max-width:none;height:auto;animation:breathe 3.2s ease-in-out infinite}
.tvsweep{position:absolute;top:-20%;bottom:-20%;left:-320px;width:260px;transform:skewX(-18deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);animation:sweep 4.5s ease-in-out infinite}
.tvcap{font:700 118px "IBM Plex Sans Arabic",system-ui,sans-serif;letter-spacing:.06em;color:#e9f6ff;animation:capPulse 2.2s ease-in-out infinite}
.tvcap span{color:var(--holo)}
.tvidle:focus-visible{outline:8px solid var(--holo)}
.stage.zoom .tvidle,.stage.dim .tvidle{opacity:0;pointer-events:none}
@keyframes breathe{0%,100%{opacity:.8;filter:drop-shadow(0 0 16px rgba(127,227,255,.4))}50%{opacity:1;filter:drop-shadow(0 0 48px rgba(127,227,255,.95))}}
@keyframes sweep{0%,55%{left:-320px}100%{left:1720px}}
@keyframes capPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tvidle img,.tvsweep,.tvcap{animation:none}}
.slide{background:linear-gradient(180deg,rgba(3,14,34,.62),rgba(3,14,34,.42))}
.slide .media{border-color:var(--holo-line);box-shadow:0 0 18px rgba(80,200,230,.18)}
.steps3 li{background:var(--holo-fill);border-color:var(--holo-line);backdrop-filter:blur(3px)}
.steps3 b{background:var(--bronze)}
.result{background:rgba(63,191,138,.12)}
.chips span{border-color:rgba(200,163,106,.5);background:rgba(200,163,106,.1)}
.bar button,.ctl button,.close{background:rgba(7,22,48,.72);border:1px solid rgba(80,200,230,.5);color:var(--ink)}
.bar button:hover,.ctl button:hover,.close:hover{border-color:var(--holo);box-shadow:0 0 10px rgba(80,200,230,.45)}
.bar .count{color:#9fb6cf}
.sheet{background:rgba(3,14,34,.94);border-inline-start:1px solid var(--holo-line)}
.sec h3{color:var(--bronze)}
.ref span{border-color:rgba(200,163,106,.5);background:rgba(200,163,106,.1)}
.limit{border-color:var(--holo-line);background:var(--holo-fill)}
.slide .play{background:rgba(7,22,48,.72);color:var(--ink);border:1px solid var(--holo);box-shadow:0 0 14px rgba(80,200,230,.45)}
#toast{border-color:var(--holo-line)}
</style>
<div id="app">
  <div class="stage" id="stage">

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=UI[lang][el.dataset.t]);
  stage.querySelectorAll(".hs").forEach(n=>n.remove());

    b.className="hs"+(h.video?" big":seen.has(h.id)?" seen":""); b.dataset.x=h.x; b.dataset.y=h.y;
    b.setAttribute("aria-label",h[lang].t);
    b.innerHTML=`<span class="holo"><img src="logo-white.svg" alt=""></span>`;
    b.onclick=h.video?playFilm:()=>openSlide(ORDER.indexOf(h.id)); stage.appendChild(b);
  });
  updateCrop();
}
// keep every hotspot inside the visible part of the picture
function updateCrop(){
  const sw=stage.clientWidth, sh=stage.clientHeight, app=document.getElementById("app");
  const vl=Math.max(0,(sw-app.clientWidth)/2), vt=Math.max(0,(sh-app.clientHeight)/2);
  stage.style.setProperty("--vl",vl+"px"); stage.style.setProperty("--vt",vt+"px");
  const mx=(vl+sw*.045)/sw*100, my=(vt+sh*.06)/sh*100;
  stage.querySelectorAll(".hs").forEach(b=>{
    b.style.left=Math.min(100-mx,Math.max(mx,+b.dataset.x))+"%"; b.style.top=Math.min(100-my,Math.max(my,+b.dataset.y))+"%"});
}
new ResizeObserver(()=>updateCrop()).observe(document.getElementById("app"));
function open(h){
  const c=h[lang], u=UI[lang];

    <div class="sec"><h3>${u.ensures}</h3><p>${esc(c.en2)}</p></div>

    <div class="sec limit"><h3>${u.limit}</h3><p>${esc(c.l)}</p><small>${u.limitNote}</small></div>`;
  }
  html+=`<p class="draft">Presenter notes · limits to be confirmed by an accredited lab specialist</p>`;
  sheet.innerHTML=html; panel.hidden=false;
  document.getElementById("x").onclick=close; document.getElementById("x").focus();

}

  if(ORDER[i]==="trust"){ // the data glass replaces the slide for this station
    clearTimeout(tourTimer); slideEl.hidden=true; panel.hidden=true;
    Glass.open({tour:touring,idx:i}); return;
  }
  const first=slideEl.hidden, h=HS.find(x=>x.id===ORDER[i]);
  if(first){
    bg.classList.add("push"); bg.style.transformOrigin=`${h.x}% ${h.y}%`; bg.style.transform="scale(2.2)";
    stage.classList.add("dim");
    setTimeout(()=>{bg.classList.remove("push");showSlide()},650);
  }else showSlide();
}
function showSlide(){
  const id=ORDER[cur], s=SL[id], h=HS.find(x=>x.id===id), pp=h.en.pp||PP[id];
  seen.add(id); try{localStorage.setItem("seen",JSON.stringify([...seen]))}catch(e){}
  slideEl.innerHTML=`
   <header><div class="eyebrow">Station ${cur+1} / ${ORDER.length}</div><h2>${esc(s.title)}</h2><p class="key">${esc(s.key)}</p></header>
   <div class="body"><div class="media${s.tall?" tall":""}"><img src="${s.img}" alt=""></div>
    <div class="right">${s.film?`<button class="play" id="sPlay">▶ Play Hamdan's film</button>`:
     `<ol class="steps3">${s.three.map((x,i)=>`<li><b>${i+1}</b>${esc(x)}</li>`).join("")}</ol>
      <div class="result">${s.res.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`}
     <div class="chips">${s.chips.map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></div>
   ${pp?`<div class="pp">${pp.map((x,i)=>`<span><b>${i+1}</b>${esc(x)}</span>`).join("")}</div>`:"<div></div>"}
   <nav class="bar"><div class="grp"><button id="sPrev" aria-label="Previous">‹ Prev</button><span class="count">${cur+1} / ${ORDER.length}</span><button id="sNext" aria-label="Next">Next ›</button></div>
    <div class="grp"><button id="sTour" class="${touring?"on":""}">${touring?"❚❚ Pause tour":"▶ Tour"}</button>${s.film?"":`<button id="sNotes">Notes</button>`}<button id="sClose" aria-label="Back to the lab">✕ Lab</button></div></nav>`;
  slideEl.hidden=false; slideEl.style.animation="none"; slideEl.offsetHeight; slideEl.style.animation="";
  document.getElementById("sPrev").onclick=()=>step(-1);
  document.getElementById("sNext").onclick=()=>step(1);
  document.getElementById("sClose").onclick=closeSlide;
  document.getElementById("sTour").onclick=()=>setTour(!touring);
  const n=document.getElementById("sNotes"); if(n)n.onclick=()=>{setTour(false);open(h)};
  const p=document.getElementById("sPlay");
  if(p)p.onclick=()=>{resumeAfterFilm={idx:cur,tour:touring};setTour(false);closeSlide();setTimeout(playFilm,700)};
  // on the tour, the Hamdan station plays the film by itself, then the tour carries on
  if(touring&&s.film){clearTimeout(tourTimer);tourTimer=setTimeout(()=>p&&p.click(),2500)}
  else if(touring){clearTimeout(tourTimer);tourTimer=setTimeout(()=>step(1),TOUR_MS)}
}
function step(d){openSlide((cur+d+ORDER.length)%ORDER.length)}
function unlockFilm(){if(filmOn)return;const p=film.play();if(p)p.then(()=>{if(!filmOn)film.pause()}).catch(()=>{})}
function setTour(on){if(on)unlockFilm();touring=on;clearTimeout(tourTimer);if(on){if(slideEl.hidden)openSlide(0);else showSlide()}else if(!slideEl.hidden)showSlide()}
function closeSlide(){
  setTour(false); slideEl.hidden=true; panel.hidden=true;
  bg.classList.add("push"); bg.style.transform="scale(1)"; stage.classList.remove("dim");
  setTimeout(()=>{bg.classList.remove("push");render()},700);
}
document.getElementById("tour").onclick=()=>setTour(true);
document.addEventListener("keydown",e=>{if(slideEl.hidden||!panel.hidden)return;
  if(e.key==="ArrowRight")step(1);else if(e.key==="ArrowLeft")step(-1);else if(e.key==="Escape")closeSlide()});
panel.addEventListener("click",e=>{if(e.target===panel)close()});
const film=document.getElementById("film"), filmx=document.getElementById("filmx");
const wall=document.getElementById("wall"), bg=stage.querySelector("img.bg");
// wall-screen corners as fractions of the lab image (measured on the 2688x1520 original): TL, TR, BR, BL
const QUAD=[[50,80],[358,192],[358,458],[50,448]].map(([x,y])=>[x/2688,y/1520]);
const ORIGIN=[.076,.19], ZOOM=3.2, DUR=1200, WW=1600, WH=900;
function homography(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){const[x,y]=src[i],[X,Y]=dst[i];
    A.push([x,y,1,0,0,0,-x*X,-y*X]);b.push(X);A.push([0,0,0,x,y,1,-x*Y,-y*Y]);b.push(Y)}
  for(let c=0;c<8;c++){let p=c;for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;
    [A[c],A[p]]=[A[p],A[c]];[b[c],b[p]]=[b[p],b[c]];
    for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c]}}
  const h=b.map((v,i)=>v/A[i][i]);
  return`matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,1)`;
}
let prog=0, anim=0;
function paint(){
  const W=stage.clientWidth,H=stage.clientHeight; if(!W)return;
  const e=prog<.5?4*prog**3:1-(-2*prog+2)**3/2, s=1+(ZOOM-1)*e;
  const ox=ORIGIN[0]*W, oy=ORIGIN[1]*H;
  bg.style.transformOrigin=`${ox}px ${oy}px`; bg.style.transform=`scale(${s})`;
  const full=[[0,0],[W,0],[W,H],[0,H]];
  const dst=QUAD.map(([fx,fy],i)=>{const x=ox+(fx*W-ox)*s,y=oy+(fy*H-oy)*s;return[x+(full[i][0]-x)*e,y+(full[i][1]-y)*e]});
  wall.style.transform=homography([[0,0],[WW,0],[WW,WH],[0,WH]],dst);
  const idle=document.getElementById("tvidle"); if(idle)idle.style.transform=wall.style.transform;
}
function animate(to,done){
  cancelAnimationFrame(anim); const from=prog, t0=performance.now();
  const step=t=>{prog=Math.min(1,(t-t0)/DUR); prog=from+(to-from)*prog; paint();
    if(prog!==to)anim=requestAnimationFrame(step); else done&&done()};
  anim=requestAnimationFrame(step);
}
new ResizeObserver(paint).observe(stage); paint();
let filmOn=false;
function playFilm(){
  if(filmOn)return; filmOn=true;
  // unlock playback with sound inside the tap, then start after the zoom
  film.currentTime=0; const p=film.play(); if(p)p.then(()=>film.pause()).catch(()=>{});
  stage.classList.add("zoom");
  seen.add("hamdan"); try{localStorage.setItem("seen",JSON.stringify([...seen]))}catch(e){}
  animate(1,()=>{if(!filmOn)return;film.hidden=false;filmx.hidden=false;filmloop.hidden=false;film.currentTime=0;
    film.play().catch(()=>{if(resumeAfterFilm&&resumeAfterFilm.tour)endFilm();else film.controls=true});filmx.focus()});
}
function endFilm(){
  if(!filmOn)return; filmOn=false;
  film.pause(); film.hidden=true; filmx.hidden=true; filmloop.hidden=true; setLoop(false); film.controls=false;
  stage.classList.remove("zoom");
  const back=resumeAfterFilm; resumeAfterFilm=null;
  animate(0,()=>{render(); if(back){touring=back.tour; openSlide((back.idx+1)%ORDER.length)}});
}
let resumeAfterFilm=null;
film.addEventListener("ended",endFilm);
film.addEventListener("click",()=>{filmx.hidden=false});
filmx.onclick=endFilm;
// repeat mode: the film plays again and again until the presenter turns it off or closes it
const filmloop=document.getElementById("filmloop");
function setLoop(v){film.loop=v;filmloop.textContent=v?"⟳ Repeat: On":"⟳ Repeat: Off";filmloop.classList.toggle("on",v)}
filmloop.onclick=()=>setLoop(!film.loop);
document.getElementById("loopBtn").onclick=()=>{setLoop(true);playFilm()};
document.getElementById("wall").onclick=playFilm;
const tvIdle=document.getElementById("tvidle");
tvIdle.onclick=playFilm;
tvIdle.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();playFilm()}};
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(filmOn)endFilm();else if(!panel.hidden){close();e.stopImmediatePropagation()}},true);
function toast(msg){let t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";stage.appendChild(t)}t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{t.hidden=true},5000)}
document.getElementById("fs").onclick=()=>{
  const d=document, el=d.documentElement;
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);return}
  const req=el.requestFullscreen||el.webkitRequestFullscreen;
  const no=()=>toast(/iPhone|iPad/.test(navigator.userAgent)?"Full screen: tap Share, then Add to Home Screen, and open it from there":"Full screen is blocked here. Open the link in Chrome or Edge, or press F11");
  if(!req||d.fullscreenEnabled===false){no();return}
  setTimeout(()=>{if(!(d.fullscreenElement||d.webkitFullscreenElement))no()},900);
  try{const p=req.call(el);if(p&&p.then)p.then(()=>screen.orientation&&screen.orientation.lock&&screen.orientation.lock("landscape").catch(()=>{})).catch(()=>{})}catch(e){}
};
render();
</script>

<style>
#offline{position:fixed;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));z-index:30;
  font:700 13px "IBM Plex Sans Arabic",system-ui,sans-serif;color:#e9f6ff;background:rgba(7,22,48,.85);border:1px solid rgba(127,227,255,.5);
  border-radius:999px;padding:7px 14px;transition:opacity .6s}
#offline.ok{border-color:rgba(63,191,138,.8);color:#bff0d9}
</style>
<div id="offline" hidden></div>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  const pill = document.getElementById("offline");
  const say = (t, ok) => { pill.textContent = t; pill.classList.toggle("ok", !!ok); pill.hidden = false; pill.style.opacity = 1; };
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (err) {}
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {});
  // a newer version took over: show it straight away
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !window.__swReloaded) { window.__swReloaded = true; location.reload(); } });
  navigator.serviceWorker.addEventListener("message", (e) => {
    const d = e.data || {};
    if (d.type === "offline-progress") say("Saving for offline use… " + d.pct + "%  (keep the internet on)");
    if (d.type === "offline-error") say("Offline saving stopped. Reopen the app with internet to finish.");
    if (d.type === "offline-status" && d.film) { say("✓ Ready to use offline", true); setTimeout(() => { pill.style.opacity = 0; setTimeout(() => { pill.hidden = true; }, 700); }, 5000); }
  });
  navigator.serviceWorker.ready.then((reg) => { say("Checking offline copy…"); (navigator.serviceWorker.controller || reg.active).postMessage({ type: "offline-check" }); });
}
</script>
